<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ZK.PK Premium Watches</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .checkout-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2.5rem;
      margin: 2.5rem 0;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-secondary);
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
    }
    @media (max-width: 768px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">ZK<span>.PK</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Watches</a></li>
        <li><a href="cart.html">Cart</a></li>
      </ul>
      <div class="nav-actions">
        <span style="font-size: 0.8rem; color: var(--gold); font-weight: 700;">Cash on Delivery</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="checkout-grid">
      <!-- Checkout Form -->
      <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem;">
        <h2 class="font-luxury" style="font-size: 1.5rem; margin-bottom: 1.5rem;">Delivery & Customer Information</h2>
        
        <form id="checkoutForm" onsubmit="submitWebsiteOrder(event)">
          <div class="form-group">
            <label>Customer Full Name *</label>
            <input type="text" id="custName" required placeholder="e.g. Tariq Mehmood">
          </div>

          <div class="form-group">
            <label>WhatsApp / Phone Number *</label>
            <input type="tel" id="custPhone" required placeholder="0311-xxxxxxx">
          </div>

          <div class="form-group">
            <label>Email Address (Optional)</label>
            <input type="email" id="custEmail" placeholder="name@example.com">
          </div>

          <div class="form-group">
            <label>Complete Delivery Address *</label>
            <textarea id="custAddress" rows="3" required placeholder="House #, Street #, Sector / Area..."></textarea>
          </div>

          <div class="form-group">
            <label>City *</label>
            <select id="custCity">
              <option value="Karachi">Karachi</option>
              <option value="Lahore">Lahore</option>
              <option value="Islamabad">Islamabad</option>
              <option value="Rawalpindi">Rawalpindi</option>
              <option value="Faisalabad">Faisalabad</option>
              <option value="Multan">Multan</option>
              <option value="Peshawar">Peshawar</option>
              <option value="Quetta">Quetta</option>
              <option value="Sialkot">Sialkot</option>
              <option value="Gujranwala">Gujranwala</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Other">Other City</option>
            </select>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 1.5rem;">
            <button type="submit" class="btn-primary" style="justify-content: center;">Method 1: Complete Website Order</button>
            <button type="button" onclick="submitWhatsAppOrder()" class="btn-whatsapp" style="justify-content: center;">Method 2: Order on WhatsApp (+92 311 1089742)</button>
          </div>
        </form>
      </div>

      <!-- Order Summary Column -->
      <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; height: fit-content;">
        <h3 class="font-luxury" style="font-size: 1.2rem; margin-bottom: 1rem;">Order Items</h3>
        <div id="orderItemsSummary" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1.5rem;"></div>
        <div style="border-top: 1px solid var(--border); padding-top: 1rem;">
          <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.15rem; color: #fff;">
            <span>Total to Pay:</span>
            <span id="grandTotalText" style="color: var(--gold);">Rs. 0</span>
          </div>
          <small style="display: block; margin-top: 8px; color: var(--emerald);">✓ Open parcel check allowed before payment.</small>
        </div>
      </div>
    </div>
  </main>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    function renderOrderSummary() {
      const cart = getCart();
      const div = document.getElementById('orderItemsSummary');
      if (cart.length === 0) {
        div.innerHTML = '<p>Your cart is empty. Please add a watch first.</p>';
        return;
      }

      const subtotal = cart.reduce((acc, i) => acc + i.product.price * i.quantity, 0);
      const shipping = subtotal > 1999 ? 0 : 150;
      const total = subtotal + shipping;

      div.innerHTML = cart.map(i => `
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
          <span>${i.product.name} x${i.quantity}</span>
          <strong style="color: #fff;">Rs. ${(i.product.price * i.quantity).toLocaleString()}</strong>
        </div>
      `).join('') + `
        <div style="display: flex; justify-content: space-between; margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px;">
          <span>Delivery:</span>
          <span>${shipping === 0 ? 'FREE' : 'Rs. ' + shipping}</span>
        </div>
      `;

      document.getElementById('grandTotalText').textContent = 'Rs. ' + total.toLocaleString();
    }

    function submitWebsiteOrder(e) {
      e.preventDefault();
      const cart = getCart();
      if (cart.length === 0) {
        alert('Cart is empty.');
        return;
      }

      const orderId = 'ZK-' + Math.floor(10000 + Math.random() * 90000);
      alert(`Alhamdulillah! Your order #${orderId} has been confirmed.\nOur team will dispatch via TCS/Leopards with Open Parcel Check.`);
      localStorage.removeItem(CART_STORAGE_KEY);
      window.location.href = 'index.html';
    }

    function submitWhatsAppOrder() {
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const address = document.getElementById('custAddress').value;
      const city = document.getElementById('custCity').value;

      if (!name || !phone || !address) {
        alert('Please fill out Name, Phone, and Address to generate the WhatsApp order.');
        return;
      }

      const url = getWhatsAppCartUrl({ name, phone, address, city });
      window.open(url, '_blank');
    }

    document.addEventListener('DOMContentLoaded', renderOrderSummary);
  </script>
</body>
</html>
